<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Layout 5</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Doe hier jouw ding! */

      body {
        display: grid;
        grid-template: repeat(4, 1fr) / repeat(3, 1fr);
        grid-template-areas:
          ". header header"
          "nav nav ."
          ". main main"
          ". footer footer";
        gap: 1em;
        padding: 1em;
      }

      header {
        grid-area: header;
      }
      nav {
        grid-area: nav;
      }
      main {
        grid-area: main;
      }
      footer {
        grid-area: footer;
      }
    </style>
  </head>
  <body id="basic-layout-5">
    <header><h1>Basic Layout 5</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main><p>bla bla bla bla bla</p></main>
    <footer><p>bla bla bla bla bla bla bla</p></footer>
  </body>
</html>
