<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Layout 3</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Doe hier jouw ding! */
      body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 8fr 1fr 1fr;
        grid-template-areas:
          "main main"
          "footer footer"
          "header nav";
        gap: 1em;
        padding: 1em;
      }
      header {
        grid-area: header;
      }
      nav {
        padding: 1em;
        grid-area: nav;
      }
      main {
        padding: 1em;
        grid-area: main;
      }
      footer {
        padding: 1em;
        grid-area: footer;
      }
    </style>
  </head>
  <body id="basic-layout-3">
    <header><h1>Basic Layout 3</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main><p>Bla bla bla...</p></main>
    <footer><p>More... things...</p></footer>
  </body>
</html>
