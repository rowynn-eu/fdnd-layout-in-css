<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Layout 4</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Doe hier jouw ding! */
      body {
        display: grid;
        gap: 1em;
        grid-template: 1fr 1fr / 4fr 1fr;
        grid-template-areas:
          "main header"
          "footer nav";
        header,
        nav,
        main,
        footer {
          padding: 1em;
        }
      }

      header {
        grid-area: header;
      }
      nav {
        grid-area: nav;
      }
      main {
        grid-area: main;
      }
      footer {
        grid-area: footer;
      }
    </style>
  </head>
  <body id="basic-layout-4">
    <header><h1>Basic Layout 4</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main><p>Bla bla bla...</p></main>
    <footer><p>Meer info...</p></footer>
  </body>
</html>
